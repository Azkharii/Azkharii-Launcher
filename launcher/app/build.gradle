plugins {
    id 'com.android.application'
}

// Release workflows pass APP_VERSION_CODE to keep public release tags and APK metadata in sync.
// Use a monotonically increasing default for local Termux builds so Android accepts
// an in-place update instead of rejecting the APK as an older version.
def localVersionCode = (System.currentTimeMillis() / 60000L).toString()
def ciVersionCode = (System.getenv('APP_VERSION_CODE')
        ?: System.getenv('GITHUB_RUN_NUMBER')
        ?: project.findProperty('APP_VERSION_CODE')
        ?: localVersionCode).toString().toInteger()
def ciVersionName = (System.getenv('APP_VERSION_NAME') ?: "1.0.${ciVersionCode}").toString()
def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('RELEASE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.cinematic.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cinematic.tvlauncher'
        minSdk 26
        targetSdk 34
        versionCode ciVersionCode
        versionName ciVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'

    // Explicitly NO video playback / ExoPlayer / Media3 per Core Non-Negotiables #4

    testImplementation 'junit:junit:4.13.2'
}
