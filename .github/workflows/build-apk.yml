name: Build Cinematic TV Launcher APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle Wrapper Integrity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HASH="d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd"
          ACTUAL_HASH="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$ACTUAL_HASH" = "$EXPECTED_HASH" || {
            echo "ERROR: gradle-wrapper.jar hash mismatch!"
            exit 1
          }
          echo "Gradle wrapper integrity verified."

      - name: Run Integrity and Quality Verifications
        run: bash tools/verify.sh

      - name: Run Unit Test Suite
        run: bash tools/run_tests.sh

      - name: Compute installable debug version
        id: debug_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(( $(date +%s) / 60 ))"
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        env:
          APP_VERSION_CODE: ${{ steps.debug_version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.debug_version.outputs.name }}
        run: bash gradlew :launcher:app:assembleDebug --stacktrace --no-daemon

      - name: Inspect and Verify Generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH" || {
            echo "ERROR: Expected APK not found at $APK_PATH"
            exit 1
          }
          APK_SIZE="$(stat -c%s "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "APK successfully built: $APK_PATH"
          echo "Size: $APK_SIZE bytes"
          echo "SHA-256: $APK_SHA256"
          {
            echo "### Build Summary"
            echo "- **Artifact:** \`app-debug.apk\`"
            echo "- **Size:** \`$APK_SIZE\` bytes"
            echo "- **SHA-256:** \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-tv-launcher-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
