name: Publish signed Cinematic TV release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinematic-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish signed OTA package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HASH="d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd"
          ACTUAL_HASH="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$ACTUAL_HASH" = "$EXPECTED_HASH"

      - name: Run integrity checks and tests
        run: |
          bash tools/verify.sh
          bash tools/run_tests.sh

      - name: Prepare persistent release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are missing; no installable release was published."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinematic-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/cinematic-tv-release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/cinematic-tv-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew :launcher:app:assembleRelease --stacktrace --no-daemon

      - name: Package release and checksum
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp launcher/app/build/outputs/apk/release/app-release.apk cinematic-tv-launcher-release.apk
          sha256sum cinematic-tv-launcher-release.apk > cinematic-tv-launcher-release.apk.sha256

      - name: Upload signed APK artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-tv-launcher-release-${{ github.run_number }}
          path: |
            cinematic-tv-launcher-release.apk
            cinematic-tv-launcher-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish public OTA release
        if: steps.signing.outputs.available == 'true' && github.event.repository.private == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" cinematic-tv-launcher-release.apk cinematic-tv-launcher-release.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "Automated signed release from commit $GITHUB_SHA. Android versionCode: $GITHUB_RUN_NUMBER."

      - name: Explain private-repository limitation
        if: steps.signing.outputs.available == 'true' && github.event.repository.private == true
        run: echo "Signed APK artifact uploaded, but private GitHub releases are not an anonymous in-app update feed."
