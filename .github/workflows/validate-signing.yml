name: Validate release signing key

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-signing.yml'
      - 'launcher/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  validate-signing:
    name: Validate secrets and build signed APK (no publication)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode and validate signing secrets without printing them
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" && test -n "${KEYSTORE_PASSWORD:-}" && test -n "${KEY_ALIAS:-}" && test -n "${KEY_PASSWORD:-}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinematic-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/cinematic-tv-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/cinematic-tv-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1
          echo "All four secrets are available; keystore password and alias validated."

      - name: Build APK using the configured release signing key
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/cinematic-tv-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: '1000000001'
          APP_VERSION_NAME: '1.0.1000000001'
        run: bash gradlew :launcher:app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify "$APK"
          echo "Signed release APK built and signature verified. No release was published."
